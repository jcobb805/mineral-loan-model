<style>
  :root{--navy:#1F3864;--line:#B7C4D8;--ink:#222;--warn:#A33;--side:#F4F7FB}
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--side);min-height:100vh}
  .hdr{background:var(--navy);color:#fff;padding:.8rem 1rem;font-weight:bold;font-size:1.1rem}
  .card{max-width:24rem;margin:12vh auto 0;background:#fff;border:1px solid var(--line);padding:1.4rem 1.3rem}

  input[type=password]{width:100%;padding:.55rem .6rem;font-size:1rem;border:1px solid var(--line);font-family:inherit}
  label.rm{display:flex;gap:.4rem;align-items:center;font-size:.85rem;margin:.7rem 0 1rem;color:#444}
  button{width:100%;padding:.6rem;background:var(--navy);color:#fff;border:0;font-size:1rem;font-weight:bold;cursor:pointer;font-family:inherit}
  button:disabled{opacity:.6;cursor:wait}
  .err{color:var(--warn);font-size:.85rem;min-height:1.2rem;margin-top:.6rem}
  @media(max-width:480px){.card{margin:8vh 16px 0}}
</style>

const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEYNAME = 'mlm-key-' + SALT.slice(0, 8);
async function keyFrom(pw) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(SALT), iterations: ITER, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function open(key) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(IV) }, key, b(DATA));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
(async () => {   // a key remembered on this device opens the page directly
  let saved = null; try { saved = localStorage.getItem(KEYNAME); } catch (e) {}
  if (!saved) return;
  try { await open(await crypto.subtle.importKey('raw', b(saved), 'AES-GCM', false, ['decrypt'])); }
  catch (e) { try { localStorage.removeItem(KEYNAME); } catch (e2) {} }
})();
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const go = document.getElementById('go'), err = document.getElementById('err');
  go.disabled = true; err.textContent = 'Checking...';
  try {
    const key = await keyFrom(document.getElementById('pw').value);
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(IV) }, key, b(DATA));
    if (document.getElementById('rm').checked) {
      try { const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key)); localStorage.setItem(KEYNAME, btoa(String.fromCharCode(...raw))); } catch (e2) {}
    }
    await open(key);
  } catch (e2) {
    err.textContent = 'That password is not right.'; go.disabled = false;
  }
});
